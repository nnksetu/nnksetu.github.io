<html lang="zh">

<style>
  :root {
    --bg: #50C878;
    --accent: #50C878;
    --accent-strong: #2fae68;
    --on-accent: #07371f;
    --header-ink: #07371f;
    --header-sub: rgba(7, 55, 31, 0.68);
    --surface: #ffffff;
    --surface-2: #f3f5f7;
    --surface-3: #e9edf1;
    --text: #17202a;
    --text-soft: #465464;
    --muted: #7b8794;
    --border: #e6eaee;
    --shadow-card: 0 8px 28px rgba(20, 43, 30, 0.06);
    --shadow-card-hover: 0 18px 44px rgba(20, 43, 30, 0.13);
    --radius-sheet: 34px;
    --radius-card: 18px;
    --focus: 0 0 0 3px rgba(80, 200, 120, 0.28);
  }

  html.green-theme, body.green-theme {
    --bg: #50C878;
    --accent: #50C878;
    --accent-strong: #2fae68;
    --on-accent: #07371f;
    --header-ink: #07371f;
    --header-sub: rgba(7, 55, 31, 0.68);
  }
  html.pink-theme, body.pink-theme {
    --bg: #f8b8c8;
    --accent: #f8b8c8;
    --accent-strong: #d8748e;
    --on-accent: #5d2434;
    --header-ink: #5d2434;
    --header-sub: rgba(93, 36, 52, 0.68);
  }
  html.blue-theme, body.blue-theme {
    --bg: #428cca;
    --accent: #428cca;
    --accent-strong: #2b6fa8;
    --on-accent: #ffffff;
    --header-ink: #ffffff;
    --header-sub: rgba(255, 255, 255, 0.78);
  }

  html, body {
    background: var(--bg);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    transition: background 0.35s cubic-bezier(0.25, 1, 0.5, 1);
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    font-size: 15px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 8% 0%, rgba(255,255,255,0.24), transparent 34%),
      radial-gradient(circle at 92% 4%, rgba(255,255,255,0.12), transparent 28%);
    z-index: 0;
  }

  .top-progress-bar {
    position: fixed; top: 0; left: 0; width: 0%; height: 3px;
    background: linear-gradient(90deg, rgba(255,255,255,0.4), rgba(255,255,255,1), rgba(255,255,255,0.4));
    background-size: 200% 100%; z-index: 10000;
    box-shadow: 0 1px 6px rgba(255,255,255,0.6); opacity: 1;
    transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease-out;
    animation: barShimmer 1.5s infinite linear;
  }
  @keyframes barShimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  header.app-loading { animation: headerBreathe 1.6s ease-in-out infinite alternate; }
  @keyframes headerBreathe {
    0% { opacity: 0.55; transform: scale(0.985); }
    100% { opacity: 0.95; transform: scale(1); }
  }

  header, .main-wrapper {
    opacity: 0; transform: translateY(18px);
    transition: opacity 0.55s cubic-bezier(0.25, 1, 0.5, 1), transform 0.55s cubic-bezier(0.25, 1, 0.5, 1);
  }
  header { opacity: 1; transform: translateY(0); }
  .loaded .main-wrapper { opacity: 1; transform: translateY(0); }

  ul.list li { opacity: 0; transform: translateY(10px); transition: opacity 0.35s ease-out, transform 0.35s cubic-bezier(0.2, 1, 0.2, 1); }
  .loaded ul.list li.show { opacity: 1; transform: translateY(0); }

  header {
    position: relative;
    z-index: 1;
    color: var(--header-ink);
    padding: calc(42px + env(safe-area-inset-top)) 24px 30px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    color: var(--header-ink);
    font-size: clamp(34px, 4.5vw, 46px);
    line-height: 1.08;
    font-weight: 700;
    letter-spacing: 0.02em;
    font-family: 'Mochiy Pop One', 'xiaolai', -apple-system, BlinkMacSystemFont, sans-serif;
    text-shadow: 0 2px 0 rgba(255,255,255,0.08);
  }
  header p {
    margin: 10px 0 0;
    color: var(--header-sub);
    font-size: 14px;
    font-weight: 500;
    font-family: 'xiaolai', -apple-system, BlinkMacSystemFont, sans-serif;
    letter-spacing: 0.06em;
  }

  .dark-mode-toggle {
    position: absolute;
    top: calc(22px + env(safe-area-inset-top));
    right: max(22px, calc((100vw - 1080px) / 2));
    width: 42px; height: 42px;
    background: rgba(255,255,255,0.24);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--header-ink);
    border: 1px solid rgba(255,255,255,0.34);
    transition: background 0.2s ease, transform 0.2s ease;
    z-index: 101;
    -webkit-tap-highlight-color: transparent;
  }
  html.blue-theme .dark-mode-toggle { background: rgba(255,255,255,0.18); color: #ffffff; }
  .dark-mode-toggle:hover { background: rgba(255,255,255,0.4); transform: scale(1.05); }
  .dark-mode-toggle:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255,255,255,0.45); }
  .dark-mode-toggle svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  html.dark-theme .dark-mode-toggle .sun-icon, html:not(.dark-theme) .dark-mode-toggle .moon-icon { display: none; }

  .main-wrapper {
    position: relative;
    z-index: 1;
    width: min(1180px, calc(100% - 32px));
    margin: 0 auto 24px;
    background: var(--surface);
    border-radius: var(--radius-sheet);
    min-height: calc(100vh - 165px);
    box-shadow: 0 24px 70px rgba(15, 40, 26, 0.13);
  }

  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 26px 20px 96px;
    box-sizing: border-box;
  }

  .tabs {
    display: flex;
    position: relative;
    width: 100%;
    max-width: 540px;
    margin: 0 auto 28px;
    padding: 4px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    touch-action: manipulation;
    overflow: hidden;
  }
  .tab-item {
    flex: 1;
    position: relative;
    z-index: 2;
    padding: 11px 8px;
    text-align: center;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.01em;
    color: var(--text-soft);
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.22s ease, opacity 0.22s ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .tab-item:hover { color: var(--text); }
  .tab-item:active { opacity: 0.72; }
  .tab-item.active { color: var(--on-accent); }
  .tab-item:focus-visible { outline: none; box-shadow: inset var(--focus); }

  .tab-slider {
    position: absolute;
    top: 4px;
    left: 4px;
    height: calc(100% - 8px);
    width: calc((100% - 8px) / 3);
    border-radius: 999px;
    z-index: 1;
    background: var(--accent) !important;
    box-shadow: 0 5px 14px rgba(16, 43, 28, 0.12);
    transition: transform 0.32s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s ease;
  }

  ul.list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: start;
    gap: 14px;
    min-height: 400px;
    min-width: 0;
    width: 100%;
  }
  .list-column { display: flex; flex-direction: column; gap: 14px; min-width: 0; width: 100%; }

  ul.list li.preview-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    align-self: stretch;
    width: 100%;
    max-width: 100%;
    height: fit-content;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    box-shadow: var(--shadow-card);
    -webkit-tap-highlight-color: transparent;
  }
  ul.list li.preview-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent-strong);
    box-shadow: var(--shadow-card-hover);
  }
  ul.list li.preview-card:active { transform: scale(0.985); }
  ul.list li.preview-card:focus-visible { outline: none; box-shadow: var(--focus), var(--shadow-card-hover); }

  .preview-wrap {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: var(--surface-2);
    overflow: hidden;
    line-height: 0;
  }
  .preview-wrap img {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
    opacity: 1;
    transition: transform 0.5s cubic-bezier(0.2, 1, 0.2, 1);
  }
  ul.list li.preview-card:hover .preview-wrap img { transform: scale(1.045); }
  .preview-wrap.preview-unavailable { display: none; }
  .preview-fallback { display: none; }

  .preview-badge {
    position: absolute;
    z-index: 2;
    top: 10px;
    left: 10px;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(12, 29, 20, 0.52);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1;
  }

  .item-content {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    padding: 12px 13px 13px;
  }
  .item-left { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; text-align: left; }
  .item-title { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-sub { font-size: 12px; color: var(--muted); line-height: 1.45; white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; min-height: 17px; }

  .card-arrow {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 14px;
    line-height: 1;
    transition: background 0.22s ease, color 0.22s ease, transform 0.22s ease;
  }
  ul.list li.preview-card:hover .card-arrow {
    background: var(--accent);
    color: var(--on-accent);
    transform: translate(1px, -1px);
  }

  .skeleton-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    min-height: 400px;
  }
  .skeleton-item {
    position: relative;
    height: auto;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: var(--radius-card);
    background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%);
    background-size: 400% 100%;
    animation: skeleton-loading 1.4s ease infinite;
  }
  .skeleton-item::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 54px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  @keyframes skeleton-loading { 0% { background-position: 100% 0 } 100% { background-position: 0 0 } }

  .pagination-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 30px;
    user-select: none;
  }
  .page-btn {
    min-width: 92px;
    text-align: center;
    padding: 10px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-soft);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease, transform 0.12s ease;
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }
  .page-btn:hover:not(.disabled) { border-color: var(--accent-strong); color: var(--accent-strong); background: var(--surface-2); }
  .page-btn:active:not(.disabled) { transform: scale(0.96); }
  .page-btn.disabled { color: var(--muted); background: var(--surface-2); border-color: var(--border); cursor: not-allowed; opacity: 0.58; transform: none; }

  .page-info-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 0 13px;
    height: 40px;
    border-radius: 999px;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    box-sizing: border-box;
  }
  .page-current-input {
    width: 34px; height: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    -moz-appearance: textfield;
    box-sizing: border-box;
    padding: 0;
  }
  .page-current-input::-webkit-outer-spin-button, .page-current-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .page-current-input:focus { border-color: var(--accent-strong); box-shadow: var(--focus); }

  .search-trigger {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    right: max(22px, calc((100vw - 1180px) / 2 + 22px));
    width: 54px; height: 54px;
    background: var(--accent);
    color: var(--on-accent);
    border: 1px solid rgba(255,255,255,0.36);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 28px rgba(17, 47, 29, 0.2);
    cursor: pointer;
    z-index: 99;
    transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .search-trigger:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 14px 34px rgba(17, 47, 29, 0.26); }
  .search-trigger:active { transform: scale(0.95); }
  .search-trigger:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(255,255,255,0.55), 0 10px 28px rgba(17, 47, 29, 0.2); }
  .search-trigger svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  .search-overlay {
    position: fixed; inset: 0;
    background: rgba(247, 249, 251, 0.86);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
  }
  .search-overlay.active { opacity: 1; pointer-events: auto; }
  .search-header {
    padding: calc(20px + env(safe-area-inset-top)) 20px 20px;
    display: flex;
    align-items: center;
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
    gap: 12px;
  }
  .search-input-wrap { position: relative; flex: 1; }
  .search-input {
    width: 100%; height: 50px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 20px 0 46px;
    font-size: 16px;
    color: var(--text);
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.22s ease, box-shadow 0.22s ease;
    box-shadow: 0 8px 24px rgba(20, 43, 30, 0.06);
  }
  .search-input:focus { border-color: var(--accent-strong); box-shadow: var(--focus), 0 8px 24px rgba(20, 43, 30, 0.06); }
  .search-icon-left { position: absolute; left: 18px; top: 15px; color: var(--muted); }
  .search-icon-left svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; }
  .search-close { font-size: 14px; color: var(--text-soft); cursor: pointer; font-weight: 600; padding: 8px 10px; border-radius: 999px; -webkit-tap-highlight-color: transparent; user-select: none; }
  .search-close:hover { color: var(--text); background: var(--surface-2); }
  .search-results { flex: 1; overflow-y: auto; max-width: 680px; width: 100%; margin: 0 auto; padding: 8px 20px 48px; box-sizing: border-box; }
  .search-results .item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease; }
  .search-results .item:hover { border-color: var(--accent-strong); transform: translateY(-1px); box-shadow: var(--shadow-card); }
  .search-results .item .title { font-weight: 700; color: var(--text); font-size: 14px; flex-shrink: 0; margin-right: 15px; }
  .search-results .item .sub { color: var(--muted); font-size: 12px; line-height: 1.4; white-space: normal; overflow-wrap: anywhere; flex: 1; text-align: right; }
  .search-empty { text-align: center; color: var(--muted); padding: 64px 20px; font-size: 14px; line-height: 1.7; }
  .search-empty strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }

  .hidden-entry-overlay { position: fixed; inset: 0; background: rgba(247,249,251,0.8); z-index: 1200; display: none; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; opacity: 0; pointer-events: none; }
  .hidden-entry-overlay.active { display: flex; opacity: 1; pointer-events: auto; backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
  .hidden-entry-dialog { width: 100%; max-width: 390px; background: var(--surface); border: 1px solid var(--border); border-radius: 26px; padding: 24px; box-shadow: 0 24px 70px rgba(17,24,39,0.12); box-sizing: border-box; transform: translateY(12px) scale(0.98); transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1); }
  .hidden-entry-overlay.active .hidden-entry-dialog { transform: translateY(0) scale(1); }
  .hidden-entry-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .hidden-entry-title { margin: 0; font-size: 20px; font-weight: 700; color: var(--text); }
  .hidden-entry-close { width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 50%; background: var(--surface-2); color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s ease, color 0.2s ease; padding: 0; flex-shrink: 0; }
  .hidden-entry-close:hover { background: var(--surface-3); color: var(--text); }
  .hidden-entry-close svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
  .hidden-entry-input { width: 100%; height: 48px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 18px; font-size: 16px; color: var(--text); outline: none; box-sizing: border-box; transition: border-color 0.22s ease, box-shadow 0.22s ease; }
  .hidden-entry-input:focus { background: var(--surface); border-color: var(--accent-strong); box-shadow: var(--focus); }
  .hidden-entry-error { min-height: 20px; margin: 10px 2px 12px; font-size: 13px; color: #ef4444; line-height: 1.5; }
  .hidden-entry-submit { width: 100%; height: 48px; border: none; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 22px rgba(80,200,120,0.22); transition: transform 0.2s ease, filter 0.2s ease; }
  .hidden-entry-submit:hover { transform: translateY(-1px); filter: brightness(0.96); }
  .hidden-entry-submit:active { transform: scale(0.98); }
  .hidden-entry-submit:disabled { opacity: 0.68; cursor: wait; transform: none; }

  @media (min-width: 860px) {
    .container { padding: 30px 24px 104px; }
    ul.list, .skeleton-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .list-column { gap: 16px; }
    .skeleton-item { aspect-ratio: 3 / 4; }
  }

  @media (min-width: 1200px) {
    ul.list, .skeleton-list { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    .list-column { gap: 18px; }
  }

  @media (max-width: 859px) {
    .main-wrapper { width: calc(100% - 16px); border-radius: 26px; min-height: calc(100vh - 140px); }
    .container { padding-left: 12px; padding-right: 12px; }
    ul.list, .skeleton-list { gap: 10px; }
    .list-column { gap: 10px; }
    .tabs { margin-bottom: 20px; }
    .item-content { padding: 10px 10px 11px; }
    .item-title { font-size: 13.5px; }

<script>
const ONE_HOUR = 60 * 60 * 1000;
const DOWNLOAD_ORIGIN = 'https://dl.setutime.top';
const HIDDEN_ENTRY_API = `${DOWNLOAD_ORIGIN}/api/hidden-entry/check`;
const HIDDEN_ENTRY_TRIGGER_WINDOW = 1500;
const HIDDEN_ENTRY_TRIGGER_COUNT = 5;
const OWNED_SITE_HOSTS = ['setutime.com', 'www.setutime.com', 'setutime.top'];

let currentTab = 'acg';
let hiddenEntryTapTimes = [];
let hiddenEntryBusy = false;

function getSavedPage(tabType) {
  try {
    const dataStr = localStorage.getItem(`setutime_page_data_${tabType}`);
    if (!dataStr) return 1;
    const item = JSON.parse(dataStr);
    const now = new Date().getTime();
    if (now - item.timestamp > ONE_HOUR) {
      localStorage.removeItem(`setutime_page_data_${tabType}`);
      return 1;
    }
    return parseInt(item.page) || 1;
  } catch (e) { return 1; }
}

function savePage(tabType, pageNum) {
  const item = { page: pageNum, timestamp: new Date().getTime() };
  localStorage.setItem(`setutime_page_data_${tabType}`, JSON.stringify(item));
}

let currentPage = { 
  acg: getSavedPage('acg'),
  setu: getSavedPage('setu'), 
  zrsetu: getSavedPage('zrsetu') 
};

// 每个分类独立缓存：服务端分页文件
let cachePages = {
  acg: {},
  setu: {},
  zrsetu: {}
};

// 累计已加载的条目（用于搜索 + 前端分页）
let allItems = {
  acg: [],
  setu: [],
  zrsetu: []
};

// 优先使用 JSON 中的预览图，旧 JSON 没有 preview 时再从子页面提取
const previewCache = {};
const previewRequests = {};
let renderRequestId = 0;

// 各分类总条数（从任意一页 JSON 的 total 字段获取）
let totalCount = {
  acg: 0,
  setu: 0,
  zrsetu: 0
};

const ITEMS_PER_PAGE = 10;          // 前端每页显示条数
const SERVER_ITEMS_PER_FILE = 50;   // 服务端每个 json 文件条数
const rootUrl = `${window.location.protocol}//${window.location.host}/`;

function toggleDarkMode() {
  const isDark = document.documentElement.classList.toggle('dark-theme');
  localStorage.setItem('setutime_dark_mode', isDark ? 'true' : 'false');
  const metaTheme = document.getElementById('meta-theme-color');
  if (metaTheme) {
    if (isDark) {
      metaTheme.setAttribute('content', '#111827');
    } else {
      const color = currentTab === 'setu' ? '#428cca' : (currentTab === 'zrsetu' ? '#f8b8c8' : '#50C878');
      metaTheme.setAttribute('content', color);
    }
  }
}

function initDarkMode() {
  const savedDark = localStorage.getItem('setutime_dark_mode');
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (savedDark === 'true' || (savedDark === null && systemDark)) {
    document.documentElement.classList.add('dark-theme');
    const metaTheme = document.getElementById('meta-theme-color');
    if (metaTheme) metaTheme.setAttribute('content', '#111827');
  }
}
initDarkMode();

function registerHiddenEntryTap() {
  const now = Date.now();
  hiddenEntryTapTimes = hiddenEntryTapTimes.filter(time => now - time <= HIDDEN_ENTRY_TRIGGER_WINDOW);
  hiddenEntryTapTimes.push(now);
  if (hiddenEntryTapTimes.length >= HIDDEN_ENTRY_TRIGGER_COUNT) {
    hiddenEntryTapTimes = [];
    openHiddenEntryDialog();
    return true;
  }
  return false;
}

function openHiddenEntryDialog() {
  toggleSearch(false);
  const overlay = document.getElementById('hiddenEntryOverlay');
  const input = document.getElementById('hiddenEntryInput');
  const error = document.getElementById('hiddenEntryError');
  const submit = document.getElementById('hiddenEntrySubmit');
  if (!overlay || !input) return;
  hiddenEntryBusy = false;
  input.value = '';
  if (error) error.innerText = '';
  if (submit) {
    submit.disabled = false;
    submit.innerText = '进入';
  }
  overlay.classList.add('active');
  overlay.setAttribute('aria-hidden', 'false');
  setTimeout(() => input.focus(), 80);
}

function closeHiddenEntryDialog() {
  const overlay = document.getElementById('hiddenEntryOverlay');
  if (!overlay) return;
  overlay.classList.remove('active');
  overlay.setAttribute('aria-hidden', 'true');
}

function isOwnedSiteHost(hostname) {
  return OWNED_SITE_HOSTS.includes(String(hostname || '').toLowerCase());
}

function resolveHiddenEntryUrl(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';

  if (raw.startsWith('/')) {
    return window.location.origin + raw;
  }

  try {
    const target = new URL(raw);
    if (isOwnedSiteHost(target.hostname)) {
      return window.location.origin + target.pathname + target.search + target.hash;
    }
    return target.href;
  } catch (e) {
    return window.location.origin + '/' + raw.replace(/^\/+/, '');
  }
}

async function submitHiddenEntry(event) {
  event.preventDefault();
  if (hiddenEntryBusy) return;

  const input = document.getElementById('hiddenEntryInput');
  const error = document.getElementById('hiddenEntryError');
  const submit = document.getElementById('hiddenEntrySubmit');
  const code = input ? input.value.trim() : '';
  if (!code) {
    if (error) error.innerText = '请输入本期密码';
    return;
  }

  hiddenEntryBusy = true;
  if (error) error.innerText = '';
  if (submit) {
    submit.disabled = true;
    submit.innerText = '验证中...';
  }

  try {
    const query = new URLSearchParams({
      code,
      siteOrigin: window.location.origin
    });
    const response = await fetch(HIDDEN_ENTRY_API + '?' + query.toString(), { method: 'GET', cache: 'no-store' });
    const data = await response.json();
    if (data && data.success && data.url) {
      window.location.href = resolveHiddenEntryUrl(data.url);
      return;
    }
    if (error) error.innerText = (data && data.msg) ? data.msg : '入口密码不正确';
  } catch (e) {
    if (error) error.innerText = '网络异常，请稍后重试';
  }

  hiddenEntryBusy = false;
  if (submit) {
    submit.disabled = false;
    submit.innerText = '进入';
  }
}

function getVisibleTabIndex(type) {
  if (type === 'acg') return 0;
  if (type === 'setu') return 1;
  return 2;
}

function handleTabClick(type) {
  if (currentTab === type) return;
  
  currentTab = type;
  localStorage.setItem('setutime_active_tab', type);
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '';
  
  const slider = document.getElementById('tabSlider');

    el.setAttribute('aria-selected', isActive ? 'true' : 'false');
    el.tabIndex = isActive ? 0 : -1;

  if (activeEl) activeEl.classList.add('active');
  
  const mainTitle = document.getElementById('main-title');
  const subTitle = document.getElementById('sub-title');
  const metaTheme = document.getElementById('meta-theme-color');

  document.body.classList.remove('blue-theme', 'pink-theme', 'green-theme');
  
  if (type === 'setu') {
    document.documentElement.classList.add('blue-theme');
    document.body.classList.add('blue-theme');
    mainTitle.innerText = "SetuTime!";
    subTitle.innerText = "ACGエッチ画像まとめ";
    slider.style.background = '#428cca';
    if (metaTheme && !document.documentElement.classList.contains('dark-theme')) metaTheme.setAttribute('content', '#428cca');
  } else if (type === 'zrsetu') {
    document.documentElement.classList.add('pink-theme');
    document.body.classList.add('pink-theme');
    mainTitle.innerText = "SetuTime!";
    subTitle.innerText = "Cosplayエッチ画像まとめ";
    slider.style.background = '#f8b8c8';
    if (metaTheme && !document.documentElement.classList.contains('dark-theme')) metaTheme.setAttribute('content', '#f8b8c8');
  } else {
    document.documentElement.classList.add('green-theme');
    document.body.classList.add('green-theme');
    mainTitle.innerText = "SetuTime!";
    subTitle.innerText = "全年龄向ACGイラストまとめ";
    slider.style.background = '#50C878';
    if (metaTheme && !document.documentElement.classList.contains('dark-theme')) metaTheme.setAttribute('content', '#50C878');
  }
  
  renderCurrentList(true);
  // 后台预加载该分类其余分页，方便搜索
  preloadAllSearchData();
}

function initTabSliderSilent(type) {
  const slider = document.getElementById('tabSlider');
  const mainTitle = document.getElementById('main-title');
  const subTitle = document.getElementById('sub-title');
  const metaTheme = document.getElementById('meta-theme-color');
  
  slider.style.transition = 'none';
  document.documentElement.classList.remove('blue-theme', 'pink-theme', 'green-theme');
  document.body.classList.remove('blue-theme', 'pink-theme', 'green-theme');
  document.querySelectorAll('.tab-item').forEach(el => {
    const isActive = el.id === 'tab-' + type;
    el.classList.toggle('active', isActive);
    el.setAttribute('aria-selected', isActive ? 'true' : 'false');
    el.tabIndex = isActive ? 0 : -1;
  });
  
  currentTab = type;
  const index = getVisibleTabIndex(type);
  slider.style.transform = `translateX(${index * 100}%)`;
  
  const activeEl = document.getElementById('tab-' + type);
  if (activeEl) activeEl.classList.add('active');
  
  if (type === 'setu') {
    document.documentElement.classList.add('blue-theme');
    document.body.classList.add('blue-theme');
    mainTitle.innerText = "SetuTime!";
    subTitle.innerText = "ACGエッチ画像まとめ";
    slider.style.background = '#428cca';
    if (metaTheme && !document.documentElement.classList.contains('dark-theme')) metaTheme.setAttribute('content', '#428cca');
  } else if (type === 'zrsetu') {
    document.documentElement.classList.add('pink-theme');
    document.body.classList.add('pink-theme');
    mainTitle.innerText = "SetuTime!";
    subTitle.innerText = "Cosplayエッチ画像まとめ";
    slider.style.background = '#f8b8c8';
    if (metaTheme && !document.documentElement.classList.contains('dark-theme')) metaTheme.setAttribute('content', '#f8b8c8');
  } else {
    document.documentElement.classList.add('green-theme');
    document.body.classList.add('green-theme');
    mainTitle.innerText = "SetuTime!";
    subTitle.innerText = "全年龄向ACGイラストまとめ";
    slider.style.background = '#50C878';
    if (metaTheme && !document.documentElement.classList.contains('dark-theme')) metaTheme.setAttribute('content', '#50C878');
  }
  
  slider.offsetHeight;
  slider.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s, width 0.3s';
}

async function fetchJson(url) {
  try {
    const timestamp = new Date().getTime();
    const connector = url.includes('?') ? '&' : '?';
    const response = await fetch(`${url}${connector}t=${timestamp}`);
    if (!response.ok) throw new Error('Network error');
    return await response.json();
  } catch (error) {
    console.error("Fetch failed:", error);
    return null;
  }
}

// 合并分页数据到 allItems，并更新 totalCount
function mergePageData(tab, pageData) {
  if (!pageData || !pageData.items) return;
  if (typeof pageData.total === 'number') {
    totalCount[tab] = pageData.total;
  }
  pageData.items.forEach(item => {
    if (!allItems[tab].some(x => x.file === item.file)) {
      allItems[tab].push(item);
    }
  });
}

// 确保某服务端分页文件已加载
async function ensureServerPage(tab, serverPage) {
  if (cachePages[tab][serverPage]) return cachePages[tab][serverPage];
  const pageData = await fetchJson(`${rootUrl}data/${tab}/${serverPage}.json`);
  if (pageData) {
    cachePages[tab][serverPage] = pageData;
    mergePageData(tab, pageData);
  }
  return pageData;
}

function getPreviewKey(tab, file) {
  return `${tab}/${file}`;
}

async function fetchPreviewUrl(tab, item) {
  const key = getPreviewKey(tab, item.file);
  if (Object.prototype.hasOwnProperty.call(previewCache, key)) {
    return previewCache[key];
  }
  if (previewRequests[key]) {
    return previewRequests[key];
  }

  if (item.preview) {
    previewCache[key] = item.preview;
    return item.preview;
  }

  const pageUrl = `${rootUrl}${tab}/${item.file}`;
  previewRequests[key] = fetch(pageUrl, { cache: 'force-cache' })
    .then(response => {
      if (!response.ok) throw new Error('Preview page request failed');
      return response.text();
    })
    .then(html => {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const imageUrls = Array.from(doc.querySelectorAll('.image-item img'))
        .map(img => img.getAttribute('data-src') || img.getAttribute('src'))
        .filter(Boolean)
        .map(url => new URL(url, pageUrl).href);

      // 偶数张图取前一个中间位置，例如 40 张取第 20 张
      const middleIndex = imageUrls.length ? Math.ceil(imageUrls.length / 2) - 1 : -1;
      const previewUrl = middleIndex >= 0 ? imageUrls[middleIndex] : null;
      previewCache[key] = previewUrl;
      return previewUrl;
    })
    .catch(error => {
      console.warn(`Preview extraction failed for ${pageUrl}`, error);
      previewCache[key] = null;
      return null;
    })
    .finally(() => {
      delete previewRequests[key];
    });

  return previewRequests[key];
}

async function loadPreviewForCard(card, tab, item) {
  if (!card || !card.isConnected) return;

  const image = card.querySelector('.preview-wrap img');
  const fallback = card.querySelector('.preview-fallback');
  const previewWrap = card.querySelector('.preview-wrap');
  if (!image || !fallback || !previewWrap) return;

  const key = getPreviewKey(tab, item.file);
  const previewUrl = await fetchPreviewUrl(tab, item);
  if (!card.isConnected || card.dataset.previewKey !== key) return;

  if (!previewUrl) {
    previewWrap.classList.add('preview-unavailable');
    return;
  }

  return new Promise(resolve => {
    let settled = false;

    const finish = loaded => {
      if (settled) return;
      settled = true;
      image.onload = null;
      image.onerror = null;

      if (loaded) {
        previewWrap.classList.add('loaded');
        fallback.hidden = true;
      } else {
        previewWrap.classList.add('preview-unavailable');
      }
      resolve(loaded);
    };

    image.onload = () => finish(true);
    image.onerror = () => finish(false);
    image.src = previewUrl;

    if (image.complete) {
      finish(image.naturalWidth > 0);
    }
  });
}

function getListColumnCount() {
  if (window.matchMedia('(min-width: 1200px)').matches) return 4;
  if (window.matchMedia('(min-width: 860px)').matches) return 3;
  return 2;
}

function createPreviewCard(item, tab, itemIndex) {
  const previewKey = getPreviewKey(tab, item.file);
  const issue = item.file.match(/\d+/)?.[0] || '?';
  const card = document.createElement('li');
  card.className = 'preview-card';
  card.tabIndex = 0;
  card.setAttribute('role', 'link');
  card.setAttribute('aria-label', `第 ${issue} 期：${item.caption || '精选合集'}`);
  card.dataset.itemIndex = itemIndex;
  card.dataset.previewKey = previewKey;
  card.onclick = () => window.open(`/${tab}/${item.file}`, '_self');
  card.onkeydown = (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      card.click();
    }
  };
  card.innerHTML = `
    <div class="preview-wrap">
      <img alt="第 ${issue} 期预览图" loading="lazy" decoding="async">
      <span class="preview-badge">#${issue}</span>
      <div class="preview-fallback" hidden>预览图暂时无法加载</div>
    </div>
    <div class="item-content">
      <div class="item-left">
        <div class="item-title">第 ${issue} 期</div>
        <div class="item-sub">${item.caption || '精选合集发布'}</div>
      </div>
      <div class="card-arrow" aria-hidden="true">↗</div>
    </div>
  `;
  return card;
}

function getShortestListColumn(columns) {
  return columns.reduce((shortest, column) => {
    return column.offsetHeight < shortest.offsetHeight ? column : shortest;
  }, columns[0]);
}

function distributeCardsToShortestColumn(cards, columns) {
  cards.forEach(card => {
    getShortestListColumn(columns).appendChild(card);
  });
}

function distributeCardsRoundRobin(cards, columns) {
  cards.forEach((card, index) => {
    columns[index % columns.length].appendChild(card);
  });
}

function rebalanceListColumns(cards, columns, listDiv, renderTab) {
  if (!listDiv.isConnected || currentTab !== renderTab || !cards.every(card => card.isConnected)) return;
  columns.forEach(column => {
    while (column.firstChild) column.firstChild.remove();
  });
  distributeCardsToShortestColumn(cards, columns);
}

async function renderCurrentList(isTabSwitch = false, isPageChange = false) {
  const requestId = ++renderRequestId;
  const listDiv = document.getElementById('contentList');
  const paginationCtrl = document.getElementById('paginationCtrl');
  const skeleton = document.getElementById('skeleton');
  const animateGallery = isTabSwitch || isPageChange;
  
  if (animateGallery) {
    listDiv.classList.remove('gallery-switching-in');
    if (isTabSwitch) {
      listDiv.style.display = 'none';
      skeleton.style.display = 'grid';
    } else {
      listDiv.style.visibility = 'hidden';
    }
    paginationCtrl.style.display = 'none';
  }
  
  const activePage = currentPage[currentTab];
  const startIdx = (activePage - 1) * ITEMS_PER_PAGE;
  const endIdx = activePage * ITEMS_PER_PAGE;
  
  // 计算需要的服务端分页文件
  const neededFileIndexStart = Math.floor(startIdx / SERVER_ITEMS_PER_FILE) + 1;
  const neededFileIndexEnd = Math.floor((endIdx - 1) / SERVER_ITEMS_PER_FILE) + 1;
  
  for (let p = neededFileIndexStart; p <= neededFileIndexEnd; p++) {
    if (!cachePages[currentTab][p]) {
      if (listDiv.style.display !== 'none') listDiv.style.opacity = '0.4';
      await ensureServerPage(currentTab, p);
      if (requestId !== renderRequestId) return;
    }
  }

  if (requestId !== renderRequestId) return;
  
  listDiv.style.opacity = '1';
  
  // 排序（保证顺序）
  allItems[currentTab].sort((a, b) => {
    const numA = parseInt(a.file.match(/\d+/)?.[0] || 0);
    const numB = parseInt(b.file.match(/\d+/)?.[0] || 0);
    return numB - numA;
  });

  const filteredPool = allItems[currentTab];
  const displayTotal = totalCount[currentTab] || filteredPool.length;
  const totalPages = Math.ceil(displayTotal / ITEMS_PER_PAGE) || 1;
  const pageItems = filteredPool.slice(startIdx, endIdx);
  
  if (pageItems.length === 0) {
    listDiv.innerHTML = `<div style="text-align:center;padding:40px;color:#9ca3af;font-weight:600;width:100%;">暂无当前页数据</div>`;
  } else {
    const renderTab = currentTab;
    const columnCount = getListColumnCount();
    listDiv.innerHTML = Array.from(
      { length: columnCount },
      () => '<div class="list-column"></div>'
    ).join('');

    const columns = Array.from(listDiv.querySelectorAll('.list-column'));
    const cards = pageItems.map((item, itemIndex) => {
      const card = createPreviewCard(item, renderTab, itemIndex);
      return card;
    });

    // 列表尚未显示时所有列高度都是 0，首次按高度分配会把卡片全部放进第一列。
    // 先轮换分配保证首帧列数正确，图片加载后再按真实高度重排。
    distributeCardsRoundRobin(cards, columns);
    let rebalanceQueued = false;
    const queueRebalance = () => {
      if (rebalanceQueued) return;
      rebalanceQueued = true;
      requestAnimationFrame(() => {
        rebalanceQueued = false;
        rebalanceListColumns(cards, columns, listDiv, renderTab);
      });
    };

    cards.forEach((card, itemIndex) => {
      loadPreviewForCard(card, renderTab, pageItems[itemIndex]).then(queueRebalance);
    });
  }
  
  skeleton.style.display = 'none';
  if (animateGallery) listDiv.classList.add('gallery-switching-in');
  listDiv.style.display = 'grid';
  listDiv.style.visibility = 'visible';
  
  const listLi = listDiv.querySelectorAll('li');
  listLi.forEach((li, idx) => {
    setTimeout(() => li.classList.add('show'), idx * 20);
  });

  if (animateGallery) {
    setTimeout(() => {
      if (requestId === renderRequestId) listDiv.classList.remove('gallery-switching-in');
    }, 220);
  }
  
  document.getElementById('pageCurrentInput').value = activePage;
  document.getElementById('pageTotalLabel').innerText = totalPages;
  
  const prevBtn = document.getElementById('prevPageBtn');
  if (activePage <= 1) prevBtn.classList.add('disabled');
  else prevBtn.classList.remove('disabled');
  
  const nextBtn = document.getElementById('nextPageBtn');
  if (activePage >= totalPages) nextBtn.classList.add('disabled');
  else nextBtn.classList.remove('disabled');
  
  paginationCtrl.style.display = 'flex';
}

function getDisplayTotal() {
  return totalCount[currentTab] || allItems[currentTab].length;
}

function handleInputJump(val) {
  const totalPages = Math.ceil(getDisplayTotal() / ITEMS_PER_PAGE) || 1;
  let pageNum = parseInt(val);
  
  if (isNaN(pageNum)) {
    document.getElementById('pageCurrentInput').value = currentPage[currentTab];
    return;
  }
  if (pageNum < 1) pageNum = 1;
  if (pageNum > totalPages) pageNum = totalPages;
  
  if (pageNum === currentPage[currentTab]) {
    document.getElementById('pageCurrentInput').value = pageNum;
    return;
  }
  
  currentPage[currentTab] = pageNum;
  savePage(currentTab, pageNum);
  renderCurrentList(false, true);
}

function changePage(direction) {
  const activePage = currentPage[currentTab];
  const totalPages = Math.ceil(getDisplayTotal() / ITEMS_PER_PAGE) || 1;
  
  const newPage = activePage + direction;
  if (newPage < 1 || newPage > totalPages) return;
  
  currentPage[currentTab] = newPage;
  savePage(currentTab, newPage);
  renderCurrentList(false, true);
}

function toggleSearch(show) {
  const overlay = document.getElementById('searchOverlay');
  const input = document.getElementById('searchInput');
  if (show) {
    overlay.classList.add('active');
    setTimeout(() => input.focus(), 100);
    // 打开搜索时确保尽量加载完当前分类
    preloadAllSearchData();
  } else {
    overlay.classList.remove('active');
    input.value = '';
    document.getElementById('searchResults').innerHTML = '';
  }
}

// 后台预加载当前分类的所有服务端分页（用于搜索）
async function preloadAllSearchData() {
  // 先确保第 1 页已加载以拿到 totalPages
  const first = await ensureServerPage(currentTab, 1);
  if (!first) return;
  const totalServerPages = first.totalPages || 1;
  
  for (let p = 2; p <= totalServerPages; p++) {
    if (!cachePages[currentTab][p]) {
      await ensureServerPage(currentTab, p);
    }
  }
}

function doSearch() {
  const val = document.getElementById('searchInput').value.trim().toLowerCase();
  const resultsDiv = document.getElementById('searchResults');
  if (!val) { resultsDiv.innerHTML = ''; return; }
  
  const currentPool = allItems[currentTab];
  
  const matched = currentPool.filter(item => {
    const isCaptionMatch = item.caption && item.caption.toLowerCase().includes(val);
    const issueNum = item.file.match(/\d+/)?.[0] || '';
    const isNumMatch = issueNum && issueNum.includes(val);
    return isCaptionMatch || isNumMatch;
  });
  
  if (matched.length === 0) {
    resultsDiv.innerHTML = `<div class="search-empty"><strong>没有找到相关结果</strong>换一个期号或标题关键词试试</div>`;
    return;
  }

  resultsDiv.innerHTML = matched.map(item => `
    <div class="item" onclick="window.open('/${currentTab}/${item.file}', '_self')">
      <div class="title">第 ${item.file.match(/\d+/)?.[0] || '?'} 期</div>
      <div class="sub">${item.caption || '完整合集'}</div>
    </div>
  `).join('');
}

window.onkeydown = (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); toggleSearch(true); }
  if (e.key === 'Escape') {
    closeHiddenEntryDialog();
    toggleSearch(false);
  }
};

function initTouchEvents() {
  document.getElementById('tab-acg').addEventListener('click', (e) => { e.preventDefault(); handleTabClick('acg'); });
  document.getElementById('tab-setu').addEventListener('click', (e) => { e.preventDefault(); handleTabClick('setu'); });
  document.getElementById('tab-zrsetu').addEventListener('click', (e) => { e.preventDefault(); handleTabClick('zrsetu'); });
  
  const activateTabByKeyboard = (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    handleTabClick(event.currentTarget.dataset.type);
  };
  document.querySelectorAll('.tab-item').forEach(tabEl => {
    tabEl.addEventListener('keydown', activateTabByKeyboard);
  });

  const darkBtn = document.getElementById('darkModeToggle');
  if (darkBtn) {
    darkBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (registerHiddenEntryTap()) return;
      toggleDarkMode();
    });
    darkBtn.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      if (registerHiddenEntryTap()) return;
      toggleDarkMode();
    });
  }

  const searchBtn = document.querySelector('.search-trigger');
  if (searchBtn) {
    searchBtn.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      toggleSearch(true);
    });
  }

  const hiddenEntryForm = document.getElementById('hiddenEntryForm');
  if (hiddenEntryForm) {
    hiddenEntryForm.addEventListener('submit', submitHiddenEntry);
  }

}

async function startAppNow() {
  initTouchEvents();
  
  const savedTab = localStorage.getItem('setutime_active_tab') || 'acg';
  initTabSliderSilent(savedTab);
  
  const pBar = document.getElementById('topProgressBar');
  if (pBar) pBar.style.width = '30%';
  
  // 只加载当前分类、当前页所需的服务端分页（按需加载，不一次拉全量）
  const activePage = currentPage[currentTab];
  const startIdx = (activePage - 1) * ITEMS_PER_PAGE;
  const serverPage = Math.floor(startIdx / SERVER_ITEMS_PER_FILE) + 1;
  
  // 至少加载第 1 页拿 total，以及当前需要的页
  await ensureServerPage(currentTab, 1);
  if (pBar) pBar.style.width = '60%';
  
  if (serverPage !== 1) {
    await ensureServerPage(currentTab, serverPage);
  }
  
  if (pBar) pBar.style.width = '85%';
  
  // 若本地记录的页码超出实际总页，纠正
  const maxPages = Math.ceil((totalCount[currentTab] || allItems[currentTab].length) / ITEMS_PER_PAGE) || 1;
  if (currentPage[currentTab] > maxPages) {
    currentPage[currentTab] = maxPages;
  }
  
  await renderCurrentList();
  
  if (pBar) {
    pBar.style.width = '100%';
    setTimeout(() => { pBar.style.opacity = '0'; }, 200);
  }
  
  const headerEl = document.getElementById('appHeader');
  if (headerEl) headerEl.classList.remove('app-loading');
  
  document.body.classList.add('loaded');
  
  // 后台慢慢预加载当前分类其余页，方便搜索
  preloadAllSearchData();
}
  
document.addEventListener('DOMContentLoaded', startAppNow);
</script>
