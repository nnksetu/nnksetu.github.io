<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#50C878">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; style-src 'unsafe-inline'; img-src 'self' data:; object-src 'none'">
<link rel="icon" href="/favicon.png" type="image/png">
<title>页面走丢了 · SetuTime!</title>
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100vh; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 24px;
    background: #50c878;
    color: #0b2e1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 440px;
    padding: 40px 28px;
    border-radius: 28px;
    background: #ffffff;
    box-shadow: 0 24px 70px rgba(15, 40, 26, 0.18);
    text-align: center;
  }
  .code { font-size: 64px; font-weight: 800; line-height: 1; margin: 0; color: #50c878; letter-spacing: 2px; }
  h1 { font-size: 20px; margin: 18px 0 8px; color: #111827; }
  p { margin: 0 0 26px; color: #6b7280; font-size: 14px; line-height: 1.7; }
  a {
    display: inline-block;
    padding: 12px 28px;
    border-radius: 24px;
    background: #50c878;
    color: #ffffff;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 8px 22px rgba(80, 200, 120, 0.28);
    transition: transform 0.2s ease, background 0.2s ease;
  }
  a:hover { background: #62d387; transform: translateY(-1px); }
  a:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(80, 200, 120, 0.35); }
</style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>页面走丢了</h1>
    <p>这个期号可能已经下架，或者链接写错了。<br>回首页看看其他合集吧。</p>
    <a href="/">返回首页</a>
  </main>
</body>
</html>
