<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="meta-theme-color" content="#50C878">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="SetuTime! 全年龄向 ACG 插画、二次元与 Cosplay 精选合集，按期浏览与搜索。">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://dl.setutime.top https://cloudflareinsights.com; form-action 'self'; manifest-src 'self'">
<link rel="canonical" href="https://www.setutime.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SetuTime!">
<meta property="og:title" content="SetuTime!">
<meta property="og:description" content="全年龄向 ACG 插画、二次元与 Cosplay 精选合集，按期浏览与搜索。">
<meta property="og:url" content="https://www.setutime.com/">
<meta property="og:image" content="https://www.setutime.com/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="SetuTime!">
<meta name="twitter:description" content="全年龄向 ACG 插画、二次元与 Cosplay 精选合集，按期浏览与搜索。">
<meta name="twitter:image" content="https://www.setutime.com/icon-512.png">
<link rel="icon" href="favicon.png" type="image/png" sizes="500x500">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://eo.setutime.top">
<link rel="dns-prefetch" href="https://eo.setutime.top">
<link rel="preload" href="fonts/mochiy-pop-one-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/xiaolai-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/index.css">
<title>SetuTime!</title>
<script src="js/theme-init.js"></script>
<script src="js/index.js" defer></script>
</head>
<body>

<div class="top-progress-bar" id="topProgressBar" aria-hidden="true"></div>

<header class="app-loading" id="appHeader">
  <button type="button" class="dark-mode-toggle" id="darkModeToggle" title="切换主题" aria-label="切换深浅色主题">
    <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>
  <h1 id="main-title">SetuTime!</h1>
  <p id="sub-title">全年龄向ACGイラストまとめ</p>
</header>

<div class="main-wrapper">
  <div class="container">
    <div class="tabs" id="tabsContainer" role="tablist" aria-label="内容分类">
      <button type="button" class="tab-item active" id="tab-acg" data-type="acg" role="tab" tabindex="0" aria-selected="true" aria-controls="contentList">全年龄向</button>
      <button type="button" class="tab-item" id="tab-setu" data-type="setu" role="tab" tabindex="-1" aria-selected="false" aria-controls="contentList">二次元篇</button>
      <button type="button" class="tab-item" id="tab-zrsetu" data-type="zrsetu" role="tab" tabindex="-1" aria-selected="false" aria-controls="contentList">cos篇</button>
      <div class="tab-slider" id="tabSlider" aria-hidden="true"></div>
    </div>

    <div id="skeleton" class="skeleton-list" aria-hidden="true">
      <div class="skeleton-item"></div>
      <div class="skeleton-item"></div>
      <div class="skeleton-item"></div>
      <div class="skeleton-item"></div>
      <div class="skeleton-item"></div>
    </div>

    <div class="list" id="contentList" aria-busy="true" hidden></div>
    <noscript><div class="list-message"><strong>需要启用 JavaScript</strong>本页面依赖 JavaScript 加载期号列表，请在浏览器设置中开启后刷新。</div></noscript>

    <div class="pagination-container" id="paginationCtrl" hidden>
      <button type="button" class="page-btn" id="prevPageBtn" aria-label="上一页">上一页</button>
      <div class="page-info-wrap">
        <label class="visually-hidden" for="pageCurrentInput">跳转到页码</label>
        <input type="number" class="page-current-input" id="pageCurrentInput" min="1" value="1" inputmode="numeric" aria-label="当前页码">
        <span aria-hidden="true">/</span>
        <span id="pageTotalLabel">1</span>
      </div>
      <button type="button" class="page-btn" id="nextPageBtn" aria-label="下一页">下一页</button>
    </div>
  </div>
</div>

<button type="button" class="search-trigger" id="searchTrigger" aria-label="搜索（Ctrl+K）">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
</button>

<div class="search-overlay" id="searchOverlay" role="dialog" aria-modal="true" aria-label="搜索期号或标题" aria-hidden="true">
  <div class="search-header">
    <div class="search-input-wrap">
      <div class="search-icon-left" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </div>
      <input type="text" class="search-input" id="searchInput" placeholder="搜索本分类下的期号或标题..." autocomplete="off" aria-label="搜索期号或标题">
    </div>
    <button type="button" class="search-close" id="searchClose">取消</button>
  </div>
  <div class="search-results" id="searchResults" aria-live="polite"></div>
</div>

<div class="hidden-entry-overlay" id="hiddenEntryOverlay" aria-hidden="true">
  <form class="hidden-entry-dialog" id="hiddenEntryForm" role="dialog" aria-modal="true" aria-labelledby="hiddenEntryTitle">
    <div class="hidden-entry-top">
      <h2 class="hidden-entry-title" id="hiddenEntryTitle">隐藏入口</h2>
      <button type="button" class="hidden-entry-close" id="hiddenEntryClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
      </button>
    </div>
    <input type="password" class="hidden-entry-input" id="hiddenEntryInput" autocomplete="off" inputmode="numeric" placeholder="输入本期密码" aria-label="本期密码">
    <div class="hidden-entry-error" id="hiddenEntryError" role="alert"></div>
    <button type="submit" class="hidden-entry-submit" id="hiddenEntrySubmit">进入</button>
  </form>
</div>

</body>
</html>
