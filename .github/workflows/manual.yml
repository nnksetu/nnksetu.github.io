name: Auto Update data.json
on:
  push:
    paths:
      - 'acg/**'
      - 'setu/**'
      - 'zrsetu/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          
      - name: 生成分类分页 JSON
        run: |
          cat > generate.js << 'EOF'
          const fs = require('fs');
          const path = require('path');

          function extractCaption(filePath) {
            try {
              const content = fs.readFileSync(filePath, 'utf8');
              // 优先匹配新的 <div id="setu-title" class="title-capsule"> 格式
              let regex = /<div[^>]*id=[\"']?setu-title[\"']?[^>]*class=[\"']?title-capsule[\"']?[^>]*>([\s\S]*?)<\/div>/i;
              let match = regex.exec(content);

              // 如果没匹配到，再尝试兼容旧的 <p style="text-align:left; font-size:16px"> 格式
              if (!match || !match[1]) {
                regex = /<p[^>]*style\s*=\s*[\"'][^\"']*?\btext-align\s*:\s*left[^\"']*?font-size\s*:\s*16px[^>]*>([\s\S]*?)<\/p>/gi;
                match = regex.exec(content);
              }

              if (match && match[1]) {
                let text = match[1]
                  .replace(/<[^>]+>/g, '')
                  .trim();
                return text;
              }
            } catch (e) {
              console.log(`读取失败 ${filePath}: ${e.message}`);
            }
            return '';
          }

          function getItems(folder) {
            if (!fs.existsSync(folder)) return [];
            return fs.readdirSync(folder)
              .filter(f => f.endsWith('.html'))
              .map(f => ({
                file: f,
                caption: extractCaption(path.join(folder, f))
              }))
              .sort((a,b) => (parseInt(b.file)||0) - (parseInt(a.file)||0));
          }

          const updatedTime = new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}).replace(/\//g,'-');
          const PAGESIZE = 50;

          const categories = [
            { name: 'acg', folder: 'acg' },
            { name: 'setu', folder: 'setu' },
            { name: 'zrsetu', folder: 'zrsetu' }
          ];

          const dataDir = path.join(__dirname, 'data');
          if (!fs.existsSync(dataDir)) fs.mkdirSync(dataDir);

          categories.forEach(({ name, folder }) => {
            const items = getItems(folder);
            const catDir = path.join(dataDir, name);
            if (!fs.existsSync(catDir)) fs.mkdirSync(catDir);

            // 清理旧分页文件，避免残留
            fs.readdirSync(catDir)
              .filter(f => f.endsWith('.json'))
              .forEach(f => fs.unlinkSync(path.join(catDir, f)));

            const totalPages = Math.ceil(items.length / PAGESIZE) || 1;

            for (let p = 1; p <= totalPages; p++) {
              const start = (p - 1) * PAGESIZE;
              const pageData = {
                updated: updatedTime,
                page: p,
                totalPages: totalPages,
                total: items.length,
                items: items.slice(start, start + PAGESIZE)
              };
              fs.writeFileSync(
                path.join(catDir, `${p}.json`),
                JSON.stringify(pageData, null, 2)
              );
            }

            console.log(`[${name}] 共 ${items.length} 条，生成 ${totalPages} 个分页文件 → data/${name}/`);
          });

          console.log('全部完成！');
          EOF
          node generate.js

      - name: 提交更新
        run: |
          git config user.name "AutoBot"
          git config user.email "bot@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet ||
          git commit -m "按分类分页生成 JSON（每页50条） [skip ci]"
          git push origin main
